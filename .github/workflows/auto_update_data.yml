name: Daily Data Update

on:
  schedule:
    # Run at 9:00 AM Cuba time (UTC-4) - this is 13:00 UTC
    - cron: '0 13 * * *'
  workflow_dispatch:  # Allows manual triggering of the workflow

jobs:
  update_data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Fetch all history for all branches and tags
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install python-dotenv pandas requests beautifulsoup4
      
      - name: Run data update script
        env:
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
        run: |
          echo "Starting data update process at $(date)"
          python scraping/daily_pipeline.py --pages_lookback 1
      
      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
      
      - name: Check for changes and commit
        run: |
          git add data/
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            # Get today's date in Cuba time (UTC-4)
            CUBA_DATE=$(TZ="America/Havana" date '+%Y-%m-%d')
            git commit -m "Auto update: Daily data scrape for ${CUBA_DATE}"
            git push
            echo "Successfully pushed data update to repository"
          fi